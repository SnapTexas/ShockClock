
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clock Control</title>
  <script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.4/dist/mqtt.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      background: #111216;
      color: #f4f4f5;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 540px;
      margin: auto;
    }

    h2 { margin-top: 0; }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 18px 0;
      font-size: 13px;
      color: #d4d4d8;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #777985;
      flex-shrink: 0;
    }

    .dot.online { background: #22c55e; }
    .dot.offline { background: #777985; }

    .optional-fields {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .panel {
      background: #1b1c22;
      border: 1px solid #303137;
      border-radius: 12px;
      padding: 16px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-size: 14px;
      font-weight: 600;
    }

    .optional {
      color: #a1a1aa;
      font-weight: normal;
      font-size: 12px;
    }

    .matrix {
      display: grid;
      grid-template-columns: repeat(8, 15px);
      gap: 5px;
      width: fit-content;
      margin: auto;
    }

    .led {
      width: 15px;
      height: 15px;
      border: 0;
      padding: 0;
      border-radius: 50%;
      background: #41424b;
      cursor: pointer;
      touch-action: manipulation;
    }

    .led.on {
      background: #ef4444;
      box-shadow: 0 0 8px #ef444466;
    }

    textarea {
      width: 100%;
      height: 85px;
      resize: vertical;
      background: #111216;
      color: white;
      border: 1px solid #383941;
      border-radius: 8px;
      padding: 11px;
      font: inherit;
      font-size: 14px;
    }

    button {
      font: inherit;
    }

    button.trigger {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      background: #ef4444;
      color: white;
      border: 0;
      border-radius: 9px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }

    button.trigger:hover {
      background: #dc2626;
    }

    button.trigger:active {
      transform: scale(.98);
    }

    #result {
      margin-top: 12px;
      font-size: 12px;
      color: #a1a1aa;
      overflow-wrap: anywhere;
    }

    /* Confirmation popup */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, .78);
      backdrop-filter: blur(5px);
    }

    .overlay.hidden {
      display: none;
    }

    .confirm-box {
      width: 100%;
      max-width: 350px;
      padding: 24px;
      border: 1px solid #393a44;
      border-radius: 18px;
      background: #1b1c22;
      text-align: center;
      box-shadow: 0 20px 80px #0008;
      animation: appear .2s ease-out;
    }

    @keyframes appear {
      from { opacity: 0; transform: scale(.92); }
      to { opacity: 1; transform: scale(1); }
    }

    .warning-icon {
      font-size: 38px;
      margin-bottom: 12px;
    }

    .confirm-box h2 {
      font-size: 22px;
      margin: 0 0 10px;
    }

    .confirm-box p {
      color: #a1a1aa;
      font-size: 14px;
      line-height: 1.5;
      margin: 0;
    }

    .confirm-actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      min-height: 48px;
      margin-top: 24px;
    }

    .confirm-actions button {
      min-width: 92px;
      padding: 12px 20px;
      border: 0;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    .cancel-btn {
      background: #383941;
      color: white;
    }

    .yes-btn {
      background: #ef4444;
      color: white;
      box-shadow: 0 4px 14px #ef444433;
    }

    .yes-btn.dodging {
      position: fixed;
      z-index: 1002;
      transition: left .12s ease, top .12s ease;
    }

    @media (min-width: 600px) {
      .optional-fields {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
<main>
  <h2>Clock Control</h2>

  <div class="status">
    <span id="dot" class="dot"></span>
    <span id="status">Clock disconnected</span>
  </div>

  <div class="optional-fields">
    <section class="panel">
      <label>LED Matrix <span class="optional">(optional)</span></label>
      <div id="matrix" class="matrix"></div>
    </section>

    <section class="panel">
      <label for="message">
        Message <span class="optional">(optional)</span>
      </label>
      <textarea id="message" maxlength="200"
        placeholder="Enter a message..."></textarea>
    </section>
  </div>

  <button id="trigger" class="trigger">Trigger Alarm</button>
  <div id="result" role="status" aria-live="polite"></div>
</main>

<!-- Confirmation prank -->
<div id="confirmOverlay" class="overlay hidden">
  <section class="confirm-box" role="dialog"
    aria-modal="true" aria-labelledby="confirmTitle">

    <div class="warning-icon">⚠️</div>
    <h2 id="confirmTitle">Are you sure? 👀</h2>
    <p>You're about to trigger the alarm.<br>
      Think carefully...</p>

    <div class="confirm-actions" id="confirmActions">
      <button id="noBtn" class="cancel-btn">Nope</button>
      <button id="yesBtn" class="yes-btn">Yes!</button>
    </div>
  </section>
</div>

<script>
  // PUBLIC MQTT BROKER
  const MQTT_HOST = "broker.hivemq.com";
  const MQTT_PORT = 8884;

  const COMMAND_TOPIC = "snapclock-00989800/control";
  const STATUS_TOPIC = "snapclock-00989800/status";

  console.log("MQTT.js loaded:", typeof mqtt !== "undefined");
  console.log("Broker:", MQTT_HOST, MQTT_PORT);
  console.log("Command topic:", COMMAND_TOPIC);
  console.log("Status topic:", STATUS_TOPIC);

  const leds = Array(64).fill(false);
  const matrixElement = document.getElementById("matrix");
  const statusElement = document.getElementById("status");
  const dot = document.getElementById("dot");
  const result = document.getElementById("result");

  let client;
  let heartbeatTimer;
  let connectedToBroker = false;
  let clockOnline = false;
  let popupOpen = false;
  let dodgeCount = 0;

  // Build the 8x8 matrix.
  leds.forEach((_, i) => {
    const led = document.createElement("button");
    led.className = "led";
    led.type = "button";
    led.setAttribute("aria-label", `LED ${i + 1}`);

    led.onclick = () => {
      leds[i] = !leds[i];
      led.classList.toggle("on", leds[i]);
    };

    matrixElement.appendChild(led);
  });

  function setStatus(text, state = "") {
    statusElement.textContent = text;
    dot.className = "dot" + (state ? " " + state : "");
    console.log("[STATUS]", text);
  }

  function showClockOffline() {
    clockOnline = false;
    setStatus(
      connectedToBroker ? "Clock disconnected" : "Broker disconnected",
      "offline"
    );
  }

  function connect() {
    if (typeof mqtt === "undefined") {
      setStatus("MQTT library failed to load", "offline");
      result.textContent = "Could not load MQTT.js.";
      return;
    }

    const brokerUrl = `wss://${MQTT_HOST}:${MQTT_PORT}/mqtt`;

    setStatus("Connecting...", "");
    console.log("[MQTT] Connecting to", brokerUrl);

    client = mqtt.connect(brokerUrl, {
      clientId: "clock_web_" +
        Math.random().toString(16).slice(2, 10),
      clean: true,
      connectTimeout: 10000,
      reconnectPeriod: 3000
    });

    client.on("connect", () => {
      connectedToBroker = true;
      console.log("[MQTT] Connected to broker.");
      setStatus("Waiting for clock...", "");

      client.subscribe(STATUS_TOPIC, { qos: 0 }, (error) => {
        if (error) {
          console.error("[MQTT] Subscribe failed:", error);
        } else {
          console.log("[MQTT] Subscribed:", STATUS_TOPIC);
        }
      });
    });

    client.on("message", (topic, payload) => {
      const text = payload.toString();

      console.log("[MQTT] Incoming topic:", topic);
      console.log("[MQTT] Incoming payload:", text);

      if (topic !== STATUS_TOPIC) return;

      try {
        const data = JSON.parse(text);
        const online =
          data.online === true || data.status === "online";

        clearTimeout(heartbeatTimer);

        if (online) {
          clockOnline = true;
          setStatus("Clock online", "online");

          heartbeatTimer = setTimeout(() => {
            console.warn("[MQTT] Clock heartbeat timed out.");
            showClockOffline();
          }, 30000);
        } else {
          showClockOffline();
        }
      } catch (error) {
        console.error("[MQTT] Invalid status JSON:", error);
      }
    });

    client.on("reconnect", () => {
      connectedToBroker = false;
      clearTimeout(heartbeatTimer);
      showClockOffline();
      setStatus("Reconnecting...", "");
    });

    client.on("close", () => {
      connectedToBroker = false;
      clearTimeout(heartbeatTimer);
      showClockOffline();
    });

    client.on("error", (error) => {
      console.error("[MQTT] Error:", error);
      setStatus("Connection error", "offline");
    });
  }

  // Publish the alarm command.
  function sendAlarmCommand() {
    console.log("========== ALARM REQUEST ==========");

    if (!client || !client.connected) {
      console.error("[MQTT] Cannot send: broker disconnected.");
      result.textContent = "Cannot send: broker disconnected.";
      return;
    }

    const hasMatrix = leds.some(Boolean);
    const message = document.getElementById("message").value.trim();

    const payload = {
      type: "clock_control",
      command: "trigger_alarm",
      trigger: true
    };

    if (hasMatrix) {
      payload.matrix = Array.from({ length: 8 }, (_, row) =>
        leds.slice(row * 8, row * 8 + 8)
          .map(on => on ? "1" : "0")
          .join("")
      );
    }

    if (message) {
      payload.message = message;
    }

    const payloadString = JSON.stringify(payload);

    console.log("[MQTT] Publish topic:", COMMAND_TOPIC);
    console.log("[MQTT] Payload JSON:", payloadString);
    result.textContent = "Sending alarm command...";

    client.publish(
      COMMAND_TOPIC,
      payloadString,
      { qos: 1 },
      (error) => {
        if (error) {
          console.error("[MQTT] Publish failed:", error);
          result.textContent = "Failed to publish command.";
        } else {
          console.log("[MQTT] Publish callback succeeded.");
          result.textContent = "Command published to broker.";
        }
        console.log("===================================");
      }
    );
  }

  // Confirmation popup.
  const overlay = document.getElementById("confirmOverlay");
  const yesBtn = document.getElementById("yesBtn");
  const noBtn = document.getElementById("noBtn");
  const actions = document.getElementById("confirmActions");
  const triggerBtn = document.getElementById("trigger");

  function resetYesButton() {
    yesBtn.classList.remove("dodging");
    yesBtn.style.left = "";
    yesBtn.style.top = "";
    actions.appendChild(yesBtn);
    dodgeCount = 0;
  }

  function openConfirmation() {
    popupOpen = true;
    resetYesButton();
    overlay.classList.remove("hidden");
    noBtn.focus();
  }

  function closeConfirmation() {
    popupOpen = false;
    overlay.classList.add("hidden");
    resetYesButton();
    triggerBtn.focus();
  }

  triggerBtn.addEventListener("click", openConfirmation);
  noBtn.addEventListener("click", closeConfirmation);

  // Move Yes before its click can activate on touch or mouse.
  function dodgeButton(event) {
    if (!popupOpen) return;

    if (event) {
      event.preventDefault();
      event.stopPropagation();
    }

    dodgeCount++;

    // After several dodges, let the user catch it.
    // This keeps the prank playable on touch devices.
    if (dodgeCount > 7) {
      yesBtn.textContent = "Okay, Yes!";
      return;
    }

    const rect = yesBtn.getBoundingClientRect();
    const margin = 12;

    const maxX = Math.max(margin, window.innerWidth - rect.width - margin);
    const maxY = Math.max(margin, window.innerHeight - rect.height - margin);

    const x = margin + Math.random() * Math.max(0, maxX - margin);
    const y = margin + Math.random() * Math.max(0, maxY - margin);

    yesBtn.classList.add("dodging");
    yesBtn.style.left = `${x}px`;
    yesBtn.style.top = `${y}px`;

    yesBtn.textContent = dodgeCount > 4 ? "Catch me!" : "Yes!";
  }

  yesBtn.addEventListener("pointerdown", (event) => {
    if (dodgeCount <= 7) {
      dodgeButton(event);
    }
  });

  // Keyboard users can still confirm without chasing the button.
  yesBtn.addEventListener("click", () => {
    if (dodgeCount <= 7) return;
    closeConfirmation();
    sendAlarmCommand();
  });

  // Close by tapping outside the dialog.
  overlay.addEventListener("click", (event) => {
    if (event.target === overlay) closeConfirmation();
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && popupOpen) {
      closeConfirmation();
    }
  });

  connect();
</script>
</body>
</html>
