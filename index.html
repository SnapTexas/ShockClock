
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Clock. Your Rules.</title>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101820;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .status {
      position: absolute;
      top: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      letter-spacing: 1px;
      color: #ff6b6b;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #e53935;
    }

    h1 {
      font-size: clamp(25px, 5vw, 36px);
      margin-bottom: 8px;
    }

    .subtitle {
      color: #a7b5c2;
      margin-bottom: 42px;
    }

    #trigger {
      width: 220px;
      height: 220px;
      border: none;
      border-radius: 50%;
      background: #e53935;
      color: white;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 10px 35px #e5393533;
      transition: transform .15s, background .15s;
    }

    #trigger:hover:not(:disabled) {
      background: #f44336;
      transform: scale(1.03);
    }

    #trigger:active:not(:disabled) {
      transform: scale(.96);
    }

    #trigger:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    #feedback {
      color: #a7b5c2;
      font-size: 14px;
      margin-top: 24px;
      min-height: 20px;
    }
  </style>
</head>

<body>
  <div class="status">
    <span class="dot" id="dot"></span>
    <span id="statusText">CONNECTING TO CLOCK...</span>
  </div>

  <h1>YOUR CLOCK. YOUR RULES.</h1>
  <div class="subtitle">Remote alarm control</div>

  <button id="trigger" disabled>
    ⏰<br><br>
    TRIGGER<br>ALARM
  </button>

  <div id="feedback">Connecting to MQTT...</div>

  <script>
    const BROKER = "wss://broker.hivemq.com:8884/mqtt";
    const TOPIC = "snapclock-00989800/control";

    const statusText = document.getElementById("statusText");
    const dot = document.getElementById("dot");
    const button = document.getElementById("trigger");
    const feedback = document.getElementById("feedback");

    const client = mqtt.connect(BROKER, {
      clientId: "snapclock_web_" +
        Math.random().toString(16).slice(2, 10),
      clean: true,
      connectTimeout: 10000,
      reconnectPeriod: 3000
    });

    function setStatus(connected, message) {
      statusText.textContent = message;
      statusText.style.color = connected ? "#72f1b8" : "#ff6b6b";
      dot.style.background = connected ? "#72f1b8" : "#e53935";
      button.disabled = !connected;
    }

    client.on("connect", () => {
      setStatus(true, "MQTT CONNECTED");
      feedback.textContent = "Ready to control your clock.";
    });

    client.on("reconnect", () => {
      setStatus(false, "RECONNECTING...");
    });

    client.on("offline", () => {
      setStatus(false, "CLOCK DISCONNECTED");
    });

    client.on("close", () => {
      setStatus(false, "CLOCK DISCONNECTED");
    });

    client.on("error", error => {
      console.error("MQTT error:", error);
      setStatus(false, "CONNECTION ERROR");
    });

    button.addEventListener("click", () => {
      if (!client.connected) return;

      button.disabled = true;
      feedback.textContent = "Sending alarm command...";

      const payload = JSON.stringify({
        trigger: true
      });

      client.publish(
        TOPIC,
        payload,
        { qos: 0, retain: false },
        error => {
          button.disabled = !client.connected;

          if (error) {
            feedback.textContent = "Failed to send command.";
          } else {
            feedback.textContent = "Command published to MQTT.";
          }
        }
      );
    });
  </script>
</body>
</html>
